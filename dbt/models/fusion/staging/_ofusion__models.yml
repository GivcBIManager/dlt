version: 2

# Model-level grain tests for the Oracle Fusion staging layer.
#
# Every model here is ReplacingMergeTree(last_update_date) + an appending
# incremental. ClickHouse dedups ON THE SORTING KEY, so each model's ORDER BY
# key IS its declared grain: if the key is not unique in the source, distinct
# rows are collapsed into one on merge and the loss is silent.
#
# So each `combination_of_columns` below is EXACTLY the model's order_by. They
# must be kept in step -- change a model's order_by and change it here too.
#
# The test is `unique_combination_final`, not the stock `unique`: after an
# append the table legitimately holds several rows per key until ClickHouse
# merges the parts, and FINAL forces that collapse at read time. See
# tests/generic/unique_combination_final.sql.
#
# Grains marked UNVERIFIED belong to warehouse tables that are still empty, so
# their key is inferred from the Fusion table's natural key rather than
# measured. The test is what turns that guess into an assertion: it passes
# vacuously today and fails the first run where real data contradicts it.

models:

  - name: dim_absence_type
    description: "conformed.dim_absence_type -- Oracle Fusion warehouse, staged 1:1. Grain: measured unique over 20 source rows."
    data_tests:
      - unique_combination_final:
          arguments:
            combination_of_columns: [absence_type_id]

  - name: dim_account_hierarchy
    description: "conformed.dim_account_hierarchy -- Oracle Fusion warehouse, staged 1:1. Grain: UNVERIFIED -- warehouse table is empty; key inferred, not measured."
    data_tests:
