version: 2

# Grain tests for the Oasis lake staged into the `oasis` database.
#
# Every model here is ReplacingMergeTree(recorded_updated_at) + an appending
# incremental, so its ORDER BY key IS its dedup key: rows sharing that key are
# collapsed on merge, keeping the one with the highest recorded_updated_at.
#
# The test is `unique_grain_per_version`, NOT `unique_combination_final`. The
# latter reads the model with FINAL, which collapses on the sorting key before
# the assertion runs -- so on these models it is a tautology and passes no
# matter how wrong the key is. See tests/generic/unique_grain_per_version.sql.
#
# Keys were measured against the live lake, not inferred. Three tables whose
# declared unique_key turned out to be violated in the landed data carry a
# widened key and a note in the model file.

models:

  - name: account_transactions
    description: "OASIS.ACCOUNT_TRANSACTIONS staged 1:1 from the Oasis lake (transaction load). Grain: measured unique over 1,520,938 lake rows."
    data_tests:
      - unique_grain_per_version:
          arguments:
            combination_of_columns: [branch_id, account_transaction_no]

  - name: admission_request
    description: "OASIS.ADMISSION_REQUEST staged 1:1 from the Oasis lake (transaction load). Grain: measured unique over 41,720 lake rows."
