name: 'oasis'
version: '1.0.0'
config-version: 2

profile: 'oasis'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Root of the Oasis Iceberg lake, read by the `iceberg_source` macro.
  # NOTE: this path is resolved by the CLICKHOUSE SERVER on its own filesystem,
  # not by the machine running dbt. Keep the trailing slash.
  iceberg_root: '/var/lib/clickhouse/user_files/iceberg_output/oasis/'

# The Oracle Fusion warehouse needs no var: a table's path there carries a
# per-load run stamp that cannot be derived from its name, so it is looked up in
# macros/_ofusion_paths.sql (generated by gui/ofusion_sources.py) via the
# `ofusion_source` macro. Its root is config.OFUSION_ROOT / $OFUSION_ROOT.

models:
  oasis:
    +materialized: table

    # ------------------------------------------------------------------
    # Layers.
    #
    # Folders classify models by their position in the DAG, not by name:
    #   staging/      reads exactly ONE lake table, 1:1, rename/cast only
    #   intermediate/ joins 2+ lake tables to assemble one business entity
    #   marts/        built on top of other dbt models via ref()
    #
    # No `+schema:` is set on any LAYER ON PURPOSE. In dbt, adding a schema
    # would rename the relations (default_staging.fact_doc etc.) and break
    # every BI query already pointed at default.<model>. Folder placement and
    # tags carry the classification; the physical table names never move.
    #
    # The one `+schema:` in this file is on `fusion/`, which is a different
    # LAKE rather than a different layer -- so it is the one folder that nests
    # lake-first, `fusion/<layer>/`, and carries the database for everything
    # under it. Those models read the Oracle Fusion warehouse and are new, so
    # nothing is pointed at them yet and they can have a database of their own.
    # ------------------------------------------------------------------
    intermediate:
      +tags: ["intermediate"]

    marts:
      +tags: ["marts"]

    # ------------------------------------------------------------------
    # The Oracle Fusion lake, read through the `ofusion_source` macro.
    #
    # Nested LAKE-first (fusion/staging/, fusion/marts/, ...) so the single
    # `+schema: fusion` below covers every layer: a model added under here
    # cannot silently land in `default` because someone forgot a config. The
    # layer folders keep their meaning and their tags, one level down.
    #
    # Only the layers that actually have models are listed -- dbt warns about
    # a configuration path that matches no resource. Add `intermediate:` and
    # `marts:` blocks with their tags when those layers get their first model.
    # ------------------------------------------------------------------
    fusion:
      +schema: fusion
      +tags: ["fusion"]

      staging:
        +tags: ["staging"]

    # ------------------------------------------------------------------
    # The Oasis lake, staged 1:1 into a database of its own.
    #
    # Same shape as `fusion/` above, and for the same reason: nested LAKE-first
    # so the single `+schema: oasis` covers every layer under it. The folder is
    # `oasis_lake` rather than `oasis` because `oasis` is already the dbt
    # PROJECT name -- the key this whole block nests under -- and a folder of
    # that name reads as a typo here.
    #
    # This is NOT a second copy of `staging/` above. That layer hand-picks a
    # few lake tables, reshapes them, and stays in `default` because the BI
    # reports are already pointed there. This one is the whole lake, one model
    # per table, 1:1. Nothing is pointed at `oasis`, so it is free to be a
    # faithful rendering rather than a compatible one.
    # ------------------------------------------------------------------
    oasis_lake:
      +schema: oasis
      +tags: ["oasis_lake"]

      staging:
        +tags: ["staging"]
